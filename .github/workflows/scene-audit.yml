name: Validate scene candidate
on:
  workflow_dispatch:
  push:
    paths: [scene-audit-source.zip, .github/workflows/scene-audit.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract reviewed source
        run: unzip -q scene-audit-source.zip
      - name: Restore verified public lesson media
        run: |
          node hydrate.cjs
          node <<'NODE'
          const fs = require('node:fs');
          // These source paths share byte-identical media; esbuild lists each emitted image once.
          const aliases = [['new4/1','new2/1'],['new5/1','new1/1'],['new5/97','new4/98'],['new5/125','new5/124'],['new5/127','new5/126']];
          for (const n of [10,11,12,13,14,77,81,83,84,87,88,89,90,91,92,93,94,95,96,98,99,100,101,102,103,104,105,106,107,108]) aliases.push(['new5/'+n,'new4/'+n]);
          for (const [to, from] of aliases) fs.copyFileSync('work/new-pages/'+from+'.webp','work/new-pages/'+to+'.webp');
          console.log('Restored '+aliases.length+' verified identical image aliases');
          NODE
      - name: Refine water normals and deterministic visual capture
        working-directory: work
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const testPath = 'candidate-motion.cjs';
          const test = fs.readFileSync(testPath,'utf8');
          const mask = "mask:[page.locator('#lessonTimeline')]";
          if(test.split(mask).length-1 !== 4) throw Error('Unexpected capture calls');
          fs.writeFileSync(testPath,test.replaceAll(mask,"mask:[page.locator('#lessonTimeline'),page.locator('#visualMeasure')]"));
          const ocean = fs.readFileSync('ocean-impact.js','utf8');
          const edits = [["120,120,200,200","120,120,320,320"],["uniform float age;varying vec3 world;","uniform float age;varying vec3 world;varying vec2 waterXY;"],["void main(){vec3 p=position;float r=length(p.xy),front=age*22.;","void main(){vec3 p=position;waterXY=p.xy;float r=length(p.xy),front=age*22.;"],["varying vec3 world;void main(){vec3 n=normalize(cross(dFdx(world),dFdy(world)));if(n.y<0.)n=-n;","uniform float age;varying vec3 world;varying vec2 waterXY;void main(){\n   float r=length(waterXY),q=r-age*22.;\n   float amplitude=.42*sin(min(age*6.,1.)*1.5708)*pow(1.-age,1.5);\n   float slope=amplitude*exp(-pow(q/1.65,2.))*(4.*cos(4.*q)-2.*q/(1.65*1.65)*sin(4.*q));\n   vec2 gradient=waterXY/max(r,.0001)*slope;\n   vec3 n=normalize(vec3(-gradient.x,1.,gradient.y));"]];
          let fixed=ocean;
          for(const [from,to] of edits){if(!fixed.includes(from))throw Error('Unexpected ocean source');fixed=fixed.replace(from,to);}
          fs.writeFileSync('ocean-impact.js',fixed);
          NODE
      - name: Install build and test dependencies
        working-directory: work
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Build teacher and student websites
        working-directory: work
        run: node build-editions.cjs
      - name: Check all 46 topics on desktop and mobile
        working-directory: work
        run: node candidate-all-scenes.cjs
      - name: Check changed animations, pause, seek, zoom and return
        working-directory: work
        run: node candidate-motion.cjs
      - name: Check projector links and all exit routes
        working-directory: work
        run: node candidate-projector.cjs
      - name: Prepare offline release candidate
        working-directory: work
        run: |
          node native/prepare-offline.cjs
          node native/offline/test-content.cjs
          node native/offline/test-updates.cjs
          node native/offline/test-update-consent.cjs
          node candidate-publish-files.cjs
      - name: Archive offline source for platform builds
        working-directory: work/native/offline
        run: zip -q ../../../offline-source-candidate.zip build.cjs main.cjs preload.cjs local-content.cjs updates.cjs update-metadata.cjs test-updates.cjs test-windows-updater.cjs test-update-consent.cjs test-content.cjs smoke.cjs fetch-content.cjs DisplayMode.cs package.json package-lock.json teacher-512.png student-512.png teacher-app.js student-app.js teacher-index.html student-index.html teacher-assets.json student-assets.json UPDATES.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-candidate-visual-evidence
          path: work/qa-results/
      - uses: actions/upload-artifact@v4
        with:
          name: scene-candidate-build
          path: |
            offline-source-candidate.zip
            work/vercel-release/
            work/student-release/
            work/teacher-build-meta.json
            work/student-build-meta.json
            work/publish-files.json
