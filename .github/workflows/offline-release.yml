name: Build fully offline desktop apps
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful scene validation run ID (leave empty for offline-source.zip)
        required: false
        type: string
  push:
    paths: ['offline-source.zip']
concurrency:
  group: offline-release
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify selected scene candidate
        if: inputs.candidate_run_id != ''
        uses: actions/github-script@v7
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        with:
          script: |
            const id = process.env.CANDIDATE_RUN_ID;
            if (!/^[0-9]+$/.test(id)) throw new Error('Invalid candidate run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
            if (run.path !== '.github/workflows/scene-audit.yml' || run.head_branch !== 'main' || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Candidate must pass all scene validation checks on main');
            core.info('Validated candidate commit '+run.head_sha);
      - name: Download validated offline candidate
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: scene-candidate-build
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Extract offline source
        working-directory: .
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if [ -n "$CANDIDATE_RUN_ID" ]; then
            unzip -q candidate/offline-source-candidate.zip -d offline
          else
            unzip -q offline-source.zip -d offline
          fi
      - run: npm ci
      - name: Bundle and verify every course asset
        run: node fetch-content.cjs
      - run: node test-content.cjs
      - run: node test-updates.cjs
      - run: node test-update-consent.cjs
      - name: Build complete installers
        run: node build.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify universal Mac apps
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for edition in Teacher Student; do
            lower=$(echo "$edition" | tr '[:upper:]' '[:lower:]')
            app="dist/$lower/mac-universal/Universe $edition.app"
            lipo "$app/Contents/MacOS/Universe $edition" -verify_arch arm64 x86_64
            codesign --verify --deep --strict "$app"
            hdiutil verify "dist/$lower/Universe-$edition-Offline-"*-Mac.dmg
          done
      - name: Generate Mac update metadata
        if: runner.os == 'macOS'
        run: node update-metadata.cjs
      - name: Test fresh installed content with external network blocked
        run: node smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: offline-installers-${{ runner.os }}
          path: |
            offline/dist/*/*Offline*.exe
            offline/dist/*/*Offline*.dmg
            offline/dist/*/teacher.yml
            offline/dist/*/student.yml
            offline/dist/*/*-mac.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-${{ runner.os }}
          path: offline/smoke-results/
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-installers-*
          path: installers
          merge-multiple: true
      - name: Publish verified offline installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find installers -type f -exec cp {} . \;
          sha256sum Universe-* > SHA256SUMS-offline.txt
          version=$(ls Universe-Teacher-Offline-*-Setup.exe | sed -E 's/Universe-Teacher-Offline-([0-9.]+)-Setup.exe/\1/')
          gh release create "offline-v$version" Universe-* teacher.yml student.yml teacher-mac.json student-mac.json SHA256SUMS-offline.txt --title "Universe Offline $version" --notes 'Offline apps with background update checks. Updates are checked automatically on launch, periodically and when reconnecting. Download and installation each require user choice. Later keeps the current version; quitting does not install updates. Mac installation uses the normal DMG flow. Lessons, scenes, slides for teachers, videos and generated background music are bundled. No first-run course download required. External reference websites and future updates need internet. Mac builds are ad-hoc signed, not Developer ID signed or notarized. Physical projector hardware not tested by CI.'
